<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Mastery Roadmap</title>
<meta name="description" content="A complete 6-phase, 48-topic Machine Learning mastery roadmap with milestone projects and exercises for every level.">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <div class="header-tag">ML Engineer Roadmap</div>
    <h1>Machine Learning<br><span>Mastery Plan</span></h1>
    <div class="header-sub">
      <span>6 Phases</span>
      <span>40+ Topics</span>
      <span>10 Milestone Projects</span>
      <span>Sequential + Parallel Strategy</span>
    </div>
  </header>
  <nav class="nav-strip" id="nav-strip"></nav>
  <div id="phases-root"></div>

<!-- TOPIC DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal-box">
    <div class="modal-top-bar" id="modal-bar"></div>
    <div class="modal-header">
      <div>
        <div class="modal-num" id="modal-num"></div>
        <div class="modal-title" id="modal-title"></div>
      </div>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-meta-row" id="modal-badges"></div>
      <div class="modal-section">
        <div class="modal-section-title">Key Concepts</div>
        <div class="modal-concepts" id="modal-concepts"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Why It Matters</div>
        <p class="modal-desc" id="modal-why" style="margin-bottom:0"></p>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Learning Resources</div>
        <div class="modal-resources" id="modal-resources"></div>
      </div>
    </div>
  </div>
</div>
  <footer>ML Mastery Roadmap &mdash; 48 Topics &middot; 10 Milestone Projects &middot; Structured for Jay @ Boaringseed</footer>
</div>
<script>
// ── DATA loaded from data.json ───────────────────────────────────────────────
let PHASES = [], SUMMARY_ROWS = [], DETAILS = {};

// ── COMPONENTS ───────────────────────────────────────────────────────────────
function TopicCard({num,name,tags,d},pi,ti){
  return `<div class="topic-card">
    <div class="topic-num">${num}</div>
    <div class="topic-card-header">
      <div class="topic-name">${name}</div>
      <button class="info-btn" onclick="openModal(${pi},${ti})" title="Learn more">&#x24D8;</button>
    </div>
    <div class="topic-tags">${tags.map(t=>`<span class="tag tag-${t.t}">${t.v}</span>`).join('')}</div>
  </div>`;
}
function TopicGrid(topics, pi){
  return `<div class="section-label">Topics</div>
  <div class="topic-grid">${topics.map((t,i)=>TopicCard(t,pi,i)).join('')}</div>`;
}
function ExBlock(cls,label,items){
  return `<div class="exercise-block">
    <div class="ex-level ${cls}"><span class="dot"></span>${label}</div>
    <ul class="ex-list">${items.map(i=>`<li>${i}</li>`).join('')}</ul>
  </div>`;
}
function ExSection({b,i,a},label='Exercises per Topic'){
  return `<div class="exercises-section">
    <div class="section-label">${label}</div>
    ${ExBlock('level-beg','Beginner',b)}
    ${ExBlock('level-int','Intermediate',i)}
    ${ExBlock('level-adv','Advanced',a)}
  </div>`;
}
function ProjectCard({ms,name,desc,meta}){
  return `<div class="project-card">
    <div class="project-milestone">${ms}</div>
    <div class="project-name">${name}</div>
    <div class="project-desc">${desc}</div>
    <div class="project-meta">${meta.map(m=>`<span class="meta-chip"><strong>${m.l}:</strong> ${m.v}</span>`).join('')}</div>
  </div>`;
}
function ProjectsSection(projects,phaseTitle){
  return `<div class="exercises-section">
    <div class="section-label">Milestone Projects — ${phaseTitle}</div>
    ${projects.map(ProjectCard).join('')}
  </div>`;
}
function PhaseSection(ph){
  return `<div class="phase ${ph.colorClass}" id="${ph.id}">
    <div class="phase-header" onclick="togglePhase(this)">
      <span class="phase-number">${ph.number}</span>
      <span class="phase-title">${ph.title}</span>
      <span class="phase-count">${ph.topics.length} topics</span>
      <span class="phase-toggle">▾</span>
    </div>
    <div class="phase-body">
      ${TopicGrid(ph.topics, PHASES.indexOf(ph))}
      ${ExSection(ph.ex)}
      ${ProjectsSection(ph.projects, ph.title)}
    </div>
  </div>`;
}
function SummaryTable(rows){
  return `<div class="phase p1" id="summary" style="margin-bottom:48px;">
    <div class="phase-header" onclick="togglePhase(this)">
      <span class="phase-number">REF</span>
      <span class="phase-title">Parallel vs Sequential Quick Reference</span>
      <span class="phase-count">All 48 topics</span>
      <span class="phase-toggle">▾</span>
    </div>
    <div class="phase-body">
      <table class="summary-table">
        <thead><tr><th>#</th><th>Topic</th><th>Requires</th><th>Parallel With</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`;
}
function NavStrip(phases){
  return phases.map((p,i)=>`<a class="nav-pill${i===0?' active':''}" href="#${p.id}">${p.label}</a>`).join('');
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderAll() {
  // Attach details to topics
  PHASES.forEach(ph=>{ph.topics.forEach(t=>{t.d=DETAILS[t.num]||null;});});

  document.getElementById('nav-strip').innerHTML = NavStrip(PHASES);
  document.getElementById('phases-root').innerHTML =
    PHASES.map(PhaseSection).join('') + SummaryTable(SUMMARY_ROWS);

  // ── INTERACTIONS ───────────────────────────────────────────────────────────
  document.querySelectorAll('.nav-pill').forEach(pill => {
    pill.addEventListener('click', function(){
      document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
    });
  });

  const phaseEls = document.querySelectorAll('.phase[id]');
  const pills    = document.querySelectorAll('.nav-pill');
  window.addEventListener('scroll', () => {
    let cur = '';
    phaseEls.forEach(p => { if(window.scrollY >= p.offsetTop - 120) cur = p.id; });
    pills.forEach(p => {
      p.classList.remove('active');
      if(p.getAttribute('href') === '#' + cur) p.classList.add('active');
    });
  });
}

// ── INTERACTIONS (phase toggle & modal — available immediately) ───────────────
function togglePhase(header){ header.closest('.phase').classList.toggle('collapsed'); }

// ── MODAL ─────────────────────────────────────────────────────────────────────
const PHASE_COLORS={p1:'#00f5a0',p2:'#7b61ff',p3:'#ff6b6b',p4:'#ffd93d',p5:'#00d4ff',p6:'#ff61ab'};
function openModal(pi,ti){
  const ph=PHASES[pi],top=ph.topics[ti],d=top.d;
  if(!d)return;
  const color=PHASE_COLORS[ph.colorClass]||'#00f5a0';
  document.getElementById('modal-bar').style.background=color;
  document.getElementById('modal-num').textContent=ph.number+' \u00b7 TOPIC '+top.num;
  document.getElementById('modal-title').textContent=top.name;
  document.getElementById('modal-desc').textContent=d.desc;
  document.getElementById('modal-why').textContent=d.why;
  document.getElementById('modal-badges').innerHTML=
    [{label:'\u23f1 Time',val:d.time},{label:'\ud83d\udcca Level',val:d.difficulty}]
    .map(b=>`<span class="modal-badge" style="--modal-color:${color}">${b.label}: ${b.val}</span>`).join('');
  document.getElementById('modal-concepts').innerHTML=
    d.concepts.map((c,ci)=>{
      if(typeof c === 'string'){
        return `<div class="modal-concept" style="border-left-color:${color}">◆ ${c}</div>`;
      }
      const uid=`cg-${pi}-${ti}-${ci}`;
      const subs=c.subtopics.map(s=>`<div class="modal-subconcept">▸ ${s}</div>`).join('');
      return `<div class="modal-concept-group">
        <div class="modal-concept-header" style="border-left-color:${color};--modal-color:${color}" onclick="this.closest('.modal-concept-group').classList.toggle('open')">
          <span class="concept-chevron">▾</span>
          <span class="concept-group-name">◆ ${c.name}</span>
          <span class="concept-count">${c.subtopics.length} topics</span>
        </div>
        <div class="modal-subtopics">${subs}</div>
      </div>`;
    }).join('');
  document.getElementById('modal-resources').innerHTML=
    d.resources.map(r=>`<div class="modal-resource"><span class="res-icon">${r.icon}</span>${r.text}${r.link?`<a href="${r.link}" target="_blank" class="res-link">🔗</a>`:''}</div>`).join('');
  document.querySelectorAll('.modal-section-title').forEach(el=>el.style.color=color);
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ── LOAD DATA FROM data.json ─────────────────────────────────────────────────
fetch('data.json')
  .then(res => {
    if (!res.ok) throw new Error('Failed to load data.json: ' + res.status);
    return res.json();
  })
  .then(data => {
    PHASES       = data.phases;
    SUMMARY_ROWS = data.summaryRows;
    DETAILS      = data.details;
    renderAll();
  })
  .catch(err => {
    console.error(err);
    document.getElementById('phases-root').innerHTML =
      `<p style="color:#ff6b6b;padding:40px;font-family:monospace;">⚠ Could not load data.json. If opening locally, serve via a local server (e.g. <code>npx serve .</code>).<br><br>${err}</p>`;
  });

</script>


</body>
</html>
